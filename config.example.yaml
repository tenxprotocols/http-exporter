metric_prefix: example
cache_ttl: 60
backoff:
  max_retries: 3
  initial_delay: 500

profiles:
  ethereum_example:
    - name: block_number
      help: Current block height
      type: gauge
      rpc:
        method: eth_blockNumber
        params: []
    - name: chain_id
      help: Chain identifier
      type: info
      rpc:
        method: eth_chainId
        path: "."

targets:
  - name: example
    profile: ethereum_example
    url: https://ethereum-rpc.publicnode.com
    labels:
      network: mainnet
      chain: ethereum
